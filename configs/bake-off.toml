# "bake-off": almost everything spends most of its life in the oven.
#
# Short work steps around long waits - I/O-bound processes. A scheduler that
# keeps the cooks busy while dishes bake overlaps the waits and serves
# everyone; one that thinks of an order as a single long job leaves cooks idle
# while the oven does the work. Utilisation and response are what separate
# schedulers here.

[kitchen]
name = "bake-off"
cores = 2
switch_cost = 2
max_ticks = 2400

[workload]
arrival_window = 1600
mean_interarrival = 7.0
warmup_orders = 3

[[workload.rush]]
start = 700
end = 1000
multiplier = 1.8

# --- the stations --------------------------------------------------------------
#
# A place in the kitchen that only so many cooks fit at. A work step names the
# station it happens at, and a cook holds one of that station's places for as
# long as it holds the order - so a station is a lock with `capacity` permits,
# and a scheduler here has to allocate places as well as cooks. An assignment
# to an order whose station is full is refused, and `obs.stations` says which
# ones have room.
#
# A cook only ever holds one station and always lets go before it takes the
# next, so this kitchen cannot deadlock. It can starve and convoy, which is
# the point.
#
# To turn contention off entirely, drop `station = ...` from every step and
# put `station = []` on the first line of this file - a bare TOML key has to
# come before the first [table]. Omitting this section does not do it: like
# the menu, it falls back to the built-in one.

[[station]]
name = "board"
capacity = 2
label = "prep bench"

[[station]]
name = "pass"
capacity = 1
label = "the pass"

[[station]]
name = "bar"
capacity = 1
label = "bar"

[[recipe]]
name = "espresso"
weight = 3.0
priority = 2
patience = [30, 50]
steps = [{ label = "pull", kind = "work", ticks = [1, 2], station = "bar" }]

[[recipe]]
name = "bread"
weight = 4.0
priority = 1
patience = [220, 320]
steps = [
  { label = "knead", kind = "work", ticks = [4, 6], station = "board" },
  { label = "prove", kind = "wait", ticks = [50, 80] },
  { label = "shape", kind = "work", ticks = [2, 3], station = "board" },
  { label = "bake", kind = "wait", ticks = [40, 60] },
  { label = "slice", kind = "work", ticks = [1, 2], station = "board" },
]

[[recipe]]
name = "tart"
weight = 3.0
priority = 1
patience = [180, 260]
steps = [
  { label = "roll", kind = "work", ticks = [3, 5], station = "board" },
  { label = "blind bake", kind = "wait", ticks = [20, 30] },
  { label = "fill", kind = "work", ticks = [3, 4], station = "pass" },
  { label = "bake", kind = "wait", ticks = [30, 45] },
  { label = "glaze", kind = "work", ticks = [1, 2], station = "pass" },
]

[[recipe]]
name = "souffle"
weight = 2.0
priority = 3
patience = [90, 130]
steps = [
  { label = "whisk", kind = "work", ticks = [6, 8], station = "board" },
  { label = "bake", kind = "wait", ticks = [30, 40] },
  { label = "serve now", kind = "work", ticks = [1, 1] },
]

[[recipe]]
name = "stew"
weight = 2.0
priority = 1
patience = [300, 420]
steps = [
  { label = "brown", kind = "work", ticks = [8, 12], station = "board" },
  { label = "simmer", kind = "wait", ticks = [120, 160] },
  { label = "finish", kind = "work", ticks = [3, 4], station = "pass" },
]

[[recipe]]
name = "croissants"
weight = 1.0
priority = 1
patience = [400, 520]
steps = [
  { label = "laminate", kind = "work", ticks = [20, 26], station = "board" },
  { label = "rest", kind = "wait", ticks = [80, 100] },
  { label = "fold", kind = "work", ticks = [10, 14], station = "board" },
  { label = "bake", kind = "wait", ticks = [30, 40] },
  { label = "tray up", kind = "work", ticks = [2, 3] },
]
